<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Delta Lua Encoder & Decoder Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0d14; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; padding: 20px; }
        
        header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 15px; border-bottom: 1px solid #252538; }
        h1 { font-size: 20px; color: #9d4edd; display: flex; align-items: center; gap: 10px; }
        .badge { background: #9d4edd22; color: #c77dff; border: 1px solid #9d4edd; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        
        /* Sekmeler (Tabs) */
        .tab-bar { display: flex; gap: 10px; margin-top: 15px; }
        .tab-btn { background: #181824; color: #888; border: 1px solid #252538; padding: 10px 20px; border-radius: 6px 6px 0 0; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .tab-btn.active { background: #242436; color: #9d4edd; border-color: #9d4edd; border-bottom: none; }
        
        .main-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1; background: #161622; border: 1px solid #252538; border-radius: 0 8px 8px 8px; padding: 20px; min-height: 0; }
        .panel { display: flex; flex-direction: column; background: #0f0f18; border: 1px solid #252538; border-radius: 6px; overflow: hidden; }
        .panel-header { background: #1a1a28; padding: 10px 15px; font-weight: bold; font-size: 13px; border-bottom: 1px solid #252538; display: flex; justify-content: space-between; align-items: center; }
        
        textarea { flex: 1; background: #0a0a10; color: #a9b7c6; border: none; padding: 15px; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; resize: none; outline: none; line-height: 1.5; }
        
        .controls { padding: 12px; background: #141420; border-top: 1px solid #252538; display: flex; gap: 10px; flex-wrap: wrap; }
        select, button { background: #27273a; color: #fff; border: 1px solid #3d3d5c; padding: 8px 14px; border-radius: 5px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        button:hover { background: #3d3d5c; }
        button.primary { background: #7b2cbf; border-color: #9d4edd; }
        button.primary:hover { background: #9d4edd; }
        button.success { background: #2a9d8f; border-color: #48cae4; }
        button.success:hover { background: #48cae4; color: #000; }
        
        .status-bar { margin-top: 15px; padding: 10px 15px; background: #14141e; border-radius: 5px; font-size: 13px; color: #aaa; border: 1px solid #222233; }
        .status-success { color: #4eff91; font-weight: bold; }
        .status-error { color: #ff5555; font-weight: bold; }
        
        .tab-content { display: none; width: 100%; height: 100%; }
        .tab-content.active { display: flex; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Delta Real Lua Encoder & Decoder <span class="badge">v2.0 Working Engine</span></h1>
        <div style="font-size: 13px; color: #aaa;">Roblox Lua scriptlerini hem gerçek şifrele hem şifresini çöz!</div>
    </header>

    <!-- SEKME BUTONLARI -->
    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('encodeTab', this)">🔐 Script Şifreleme (Encoder)</button>
        <button class="tab-btn" onclick="switchTab('decodeTab', this)">🔓 Şifre Çözme (Decoder)</button>
    </div>

    <!-- SEKME 1: SHIFRELEME -->
    <div id="encodeTab" class="tab-content active">
        <div class="main-container">
            <div class="panel">
                <div class="panel-header">
                    <span>📝 Orijinal Temiz Lua Kodun</span>
                    <button onclick="pasteDemoEncode()">Örnek Kod Yapıştır</button>
                </div>
                <textarea id="rawInput" placeholder="-- Buraya şifrelemek istediğin temiz Lua kodunu yapıştır...&#10;print('Delta Hub Activated!')&#10;game.Players.LocalPlayer.Character.Humanoid.WalkSpeed = 50"></textarea>
                <div class="controls">
                    <select id="modeSelect">
                        <option value="xor">XOR Multi-Byte Encryption</option>
                        <option value="base64">Base64 Loadstring Wrapper</option>
                        <option value="hex">Hex String Array</option>
                    </select>
                    <button class="primary" onclick="convertLua()">🚀 Şifrele & Dönüştür</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span>🔒 Şifrelenmiş Delta Kodu</span>
                    <button class="primary" onclick="copyText('encryptedOutput')">📋 Kopyala</button>
                </div>
                <textarea id="encryptedOutput" readonly placeholder="Dönüştürülmüş Lua kodu burada görünecek..."></textarea>
                <div class="controls">
                    <button class="success" onclick="sendToDecoder()">🔓 Bu Kodu Decodera Gönder</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SEKME 2: SHIFRE COZME -->
    <div id="decodeTab" class="tab-content">
        <div class="main-container">
            <div class="panel">
                <div class="panel-header">
                    <span>🔒 Şifreli Delta / Lua Kodu</span>
                    <button onclick="pasteDemoDecode()">Örnek Şifreli Kod Yapıştır</button>
                </div>
                <textarea id="encodedInput" placeholder="-- Buraya XOR, Base64 veya Hex ile şifrelenmiş Lua kodunu yapıştır..."></textarea>
                <div class="controls">
                    <button class="primary" onclick="decodeLua()">🔓 Şifreyi Çöz (Deobfuscate)</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span>📄 Çözülmüş Temiz Lua Kodu</span>
                    <button class="primary" onclick="copyText('decodedOutput')">📋 Kopyala</button>
                </div>
                <textarea id="decodedOutput" readonly placeholder="Çözülen orijinal kod burada görünecek..."></textarea>
                <div class="controls">
                    <span id="decodeInfo" style="font-size: 12px; color: #888; align-self: center;">Bekleniyor...</span>
                </div>
            </div>
        </div>
    </div>

    <div class="status-bar" id="statusBar">Hazır. Bir işlem seç ve başlat.</div>

    <script>
        // Tab Değiştirme
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // --- ENCODER MOTORU ---
        function convertLua() {
            const input = document.getElementById('rawInput').value.trim();
            const mode = document.getElementById('modeSelect').value;
            const outputArea = document.getElementById('encryptedOutput');
            const status = document.getElementById('statusBar');

            if (!input) return alert("Lütfen önce bir Lua kodu girin!");

            let resultLua = "";
            if (mode === "xor") resultLua = generateXor(input);
            else if (mode === "base64") resultLua = generateBase64(input);
            else if (mode === "hex") resultLua = generateHex(input);

            outputArea.value = resultLua;
            status.innerHTML = `<span class="status-success">✓ Kod [${mode.toUpperCase()}] modunda başarıyla şifrelendi!</span>`;
        }

        function generateXor(code) {
            const key = Math.floor(Math.random() * 200) + 15;
            const bytes = [];
            for (let i = 0; i < code.length; i++) bytes.push(code.charCodeAt(i) ^ key);

            return `--[[ Encrypted with Delta XOR Engine ]]--\nlocal _key = ${key}\nlocal _data = {${bytes.join(",")}}\nlocal _str = ""\nfor i = 1, #_data do\n    _str = _str .. string.char(bit32.bxor(_data[i], _key))\nend\n(loadstring or load)(_str)()`;
        }

        function generateBase64(code) {
            const b64 = btoa(unescape(encodeURIComponent(code)));
            return `--[[ Encrypted with Delta Base64 Engine ]]--\nlocal _b='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'\nlocal function _dec(d)\n    d = string.gsub(d, '[^'.._b..'=]', '')\n    return (d:gsub('.', function(x)\n        if (x == '=') then return '' end\n        local r,f='',( _b:find(x)-1 )\n        for i=6,1,-1 do r=r..(f%2^i>=2^(i-1) and '1' or '0') end\n        return r\n    end):gsub('%d%d%d%d%d%d%d%d', function(x)\n        if (#x ~= 8) then return '' end\n        local c=0\n        for i=1,8 do c=c+(x:sub(i,i)=='1' and 2^(8-i) or 0) end\n        return string.char(c)\n    end))\nend\n(loadstring or load)(_dec("${b64}"))()`;
        }

        function generateHex(code) {
            const hexArr = [];
            for (let i = 0; i < code.length; i++) {
                hexArr.push("\\x" + code.charCodeAt(i).toString(16).padStart(2, '0'));
            }
            return `--[[ Encrypted with Delta Hex Engine ]]--\nlocal _hex = "${hexArr.join("")}"\n(loadstring or load)(_hex)()`;
        }

        // --- DECODER MOTORU (GERÇEK ŞİFRE ÇÖZÜCÜ) ---
        function decodeLua() {
            const input = document.getElementById('encodedInput').value.trim();
            const outputArea = document.getElementById('decodedOutput');
            const status = document.getElementById('statusBar');
            const info = document.getElementById('decodeInfo');

            if (!input) return alert("Lütfen çözülecek şifreli bir Lua kodu yapıştırın!");

            try {
                // 1. DENE: XOR Algoritması Yakalama
                if (input.includes('_key =') && input.includes('_data =')) {
                    const keyMatch = input.match(/_key\s*=\s*(\d+)/);
                    const dataMatch = input.match(/_data\s*=\s*\{([^}]+)\}/);

                    if (keyMatch && dataMatch) {
                        const key = parseInt(keyMatch[1]);
                        const bytes = dataMatch[1].split(',').map(n => parseInt(n.trim()));
                        let decoded = "";
                        for (let b of bytes) {
                            decoded += String.fromCharCode(b ^ key);
                        }
                        outputArea.value = decoded;
                        info.innerText = "Algoritma: Delta XOR";
                        status.innerHTML = `<span class="status-success">✓ XOR Şifresi başarıyla çözüldü!</span>`;
                        return;
                    }
                }

                // 2. DENE: Base64 Algoritması Yakalama
                const b64Match = input.match(/_dec\s*\(\s*["']([^"']+)["']\s*\)/) || input.match(/loadstring\s*\(\s*["']([A-Za-z0-9+/=]{10,})["']\s*\)/);
                if (b64Match) {
                    const b64Str = b64Match[1];
                    const decoded = decodeURIComponent(escape(atob(b64Str)));
                    outputArea.value = decoded;
                    info.innerText = "Algoritma: Base64 String";
                    status.innerHTML = `<span class="status-success">✓ Base64 Şifresi başarıyla çözüldü!</span>`;
                    return;
                }

                // 3. DENE: Hex Format (\x48\x65\x6c\x6c\x6f) Yakalama
                if (input.includes('\\x')) {
                    const hexMatches = input.match(/\\x[0-9a-fA-F]{2}/g);
                    if (hexMatches && hexMatches.length > 0) {
                        let decoded = "";
                        for (let hex of hexMatches) {
                            decoded += String.fromCharCode(parseInt(hex.replace('\\x', ''), 16));
                        }
                        outputArea.value = decoded;
                        info.innerText = "Algoritma: Hex Bytecode Array";
                        status.innerHTML = `<span class="status-success">✓ Hex Şifresi başarıyla çözüldü!</span>`;
                        return;
                    }
                }

                // Tanımlanamadıysa
                status.innerHTML = `<span class="status-error">✕ Şifre çözülemedi! Kod desteklenmeyen veya çok ağır obfuscate (Luraph/IronBrew vb.) edilmiş olabilir.</span>`;
            } catch (err) {
                status.innerHTML = `<span class="status-error">✕ Hata: ${err.message}</span>`;
            }
        }

        // Yardımcı Fonksiyonlar
        function sendToDecoder() {
            const enc = document.getElementById('encryptedOutput').value;
            if (!enc) return alert("Önce bir kod şifreleyin!");
            document.getElementById('encodedInput').value = enc;
            switchTab('decodeTab', document.querySelectorAll('.tab-btn')[1]);
            decodeLua();
        }

        function copyText(id) {
            const txt = document.getElementById(id);
            if (!txt.value) return;
            txt.select();
            document.execCommand('copy');
            alert("Kopyalandı!");
        }

        function pasteDemoEncode() {
            document.getElementById('rawInput').value = `print("Delta Script Loaded!")\nlocal p = game.Players.LocalPlayer\np.Character.Humanoid.WalkSpeed = 100`;
        }

        function pasteDemoDecode() {
            document.getElementById('encodedInput').value = `--[[ Encrypted with Delta XOR Engine ]]--\nlocal _key = 88\nlocal _data = {56,42,17,22,28,8,11,88,11,43,58,41,40,44,8,44,39,41,57,45,36,88,57,41,49,61,61,61,50}\nlocal _str = ""\nfor i = 1, #_data do _str = _str .. string.char(bit32.bxor(_data[i], _key)) end\n(loadstring or load)(_str)()`;
        }
    </script>
</body>
</html>
